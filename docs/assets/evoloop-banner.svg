<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="EvoLoop — the self-evolving engineering base for agent-maintained projects">
  <title>EvoLoop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="halo" cx="18%" cy="42%" r="48%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#halo)"/>

  <g transform="translate(73 73) scale(0.3)">
    <path d="M 396.95 204.7 A 150 150 0 1 1 331 126.1"
          fill="none" stroke="url(#ring)" stroke-width="32" stroke-linecap="round"/>
    <path d="M 369.1 148.1 L 314 155.5 L 348 96.7 Z" fill="#C084FC"/>
    <rect x="176" y="268" width="30" height="62" rx="15" fill="url(#bar1)"/>
    <rect x="241" y="232" width="30" height="96" rx="15" fill="url(#bar2)"/>
    <rect x="306" y="196" width="30" height="134" rx="15" fill="url(#bar3)"/>
  </g>

  <text x="248" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-2" fill="#F8FAFC">EvoLoop</text>
  <text x="251" y="205" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="400" fill="#94A3B8">The self-evolving engineering base for agent-maintained projects</text>
  <rect x="251" y="228" width="520" height="4" rx="2" fill="url(#rule)"/>
</svg>