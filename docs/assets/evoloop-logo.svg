<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EvoLoop">
  <title>EvoLoop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="halo" cx="44%" cy="38%" r="62%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="106" y1="106" x2="406" y2="406">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- Loop: clockwise arrow, gap at the upper right -->
  <path d="M 396.95 204.7 A 150 150 0 1 1 331 126.1"
        fill="none" stroke="url(#ring)" stroke-width="32" stroke-linecap="round"/>
  <path d="M 369.1 148.1 L 314 155.5 L 348 96.7 Z" fill="#C084FC"/>

  <!-- Evolution: three ascending steps inside the loop -->
  <rect x="176" y="268" width="30" height="62" rx="15" fill="url(#bar1)"/>
  <rect x="241" y="232" width="30" height="96" rx="15" fill="url(#bar2)"/>
  <rect x="306" y="196" width="30" height="134" rx="15" fill="url(#bar3)"/>
</svg>